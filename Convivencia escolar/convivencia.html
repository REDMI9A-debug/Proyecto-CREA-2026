<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convivencia Escolar | Voces de Babahoyo</title>
    <meta name="description"
        content="Momentos, anécdotas y vivencias de estudiantes de la Unidad Educativa Babahoyo sobre convivencia y valores.">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="convivencia.css">
</head>

<body>

        <div class="layout-principal">
            <aside class="columna-videos" aria-labelledby="lista-videos-titulo">
                <div class="columna-encabezado">
                    <h2 id="lista-videos-titulo">Episodios</h2>
                    <p id="contador-videos" class="contador-videos" aria-live="polite"></p>
                </div>

                <section class="video-list" id="thumbnailGrid" aria-label="Lista de videos de convivencia escolar"></section>
            </aside>

            <section class="reproductor-destacado" aria-labelledby="video-activo-titulo">
                <div id="player-placeholder" class="player-placeholder" aria-hidden="false">
                    <div class="placeholder-icono" aria-hidden="true">
                    </div>
                </div>

                <div class="video-player hidden" id="video-player-shell">
                    <iframe id="mainPlayer" title="Reproductor de video de Convivencia Escolar"
                        src="about:blank" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen></iframe>
                </div>

                <div class="video-meta">
                    <h2 id="video-activo-titulo">Selecciona un video</h2>
                </div>
            </section>
        </div>

    <script src="convivencia.js"></script>
</body>

</html>
